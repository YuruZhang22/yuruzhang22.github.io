# Site Settings
locale                   : "en-US"
title                    : "Yuru Zhang / Ph.D. Candidate"
title_separator          : "-"
name                     : "Yuru Zhang" # used in the footer copyright line
description              : "Personal homepage of Yuru Zhang, Ph.D. candidate in Computer Science at the University of Nebraska-Lincoln, working on wireless networks, digital twins and edge computing."
url                      : https://yuruzhang22.github.io # no trailing slash: base_path appends to it
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "YuruZhang22/yuruzhang22.github.io"


# Structured data: _includes/seo.html turns this into a schema.org Person
# blob for search engines. It previously rendered "name": "Your Name" with a
# null sameAs, which was worse than emitting nothing.
social:
  type                   : Person
  name                   : "Yuru Zhang"
  links:
    - "https://scholar.google.com/citations?user=omELe68AAAAJ&hl=en"
    - "https://www.linkedin.com/in/yuruzhang22/"
    - "https://github.com/YuruZhang22"


# Site Author
# The sidebar renders whichever of these is filled in. _includes/author-profile.html
# supports many more (orcid, researchgate, twitter, ...) -- add the key here to show one.
author:
  name             : "Yuru Zhang"
  avatar           : "yuruzhang.png"
  bio              : "Ph.D. Candidate"
  email            : "yzhang176@huskers.unl.edu"
  linkedin         : "yuruzhang22/"
  github           : "YuruZhang22"
  googlescholar    : "https://scholar.google.com/citations?user=omELe68AAAAJ&hl=en"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .bundle
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true




# Outputting
permalink: /:categories/:title/
timezone: America/Chicago # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from


